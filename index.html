<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Buttons</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1e1e1e;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

button{
    width:100%;
    height:60px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#3498db;
    color:white;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#2980b9;
    transform:translateY(-3px);
}

button:active{
    transform:scale(.97);
}

/* 📱 Phones */
@media (max-width:600px){

    .container{
        grid-template-columns:1fr;
    }

    button{
        height:65px;
        font-size:20px;
    }

}
</style>
</head>

<body>

<div class="container">
    <button onclick="location.href='eggs/Digital Clock.html'">Digital Clock</button>
    <button>Button 2</button>
    <button>Button 3</button>
    <button>Button 4</button>
    <button>Button 5</button>
    <button>Button 6</button>
    <button>Button 7</button>
    <button>Button 8</button>
    <button>Button 9</button>
    <button>Button 10</button>
</div>

</body>
</html>
