<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Buttons</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 25px;
}

/* ===== YOUR BUTTON CSS ===== */

.button {
  cursor: pointer;
  padding: 12px 18px;
  border-radius: 30px;
  border: 5px solid #e50000;
  display: inline-block;
  overflow: hidden;
  background: red;
  box-shadow:
    inset 6px 6px 10px rgba(255, 255, 255, 0.6),
    inset -6px -6px 10px rgba(0, 0, 0, 0.3),
    2px 2px 10px rgba(0, 0, 0, 0.3),
    -2px -2px 10px rgba(255, 255, 255, 0.5);
  transition:
    box-shadow 0.3s ease,
    transform 0.1s ease;
}

.button span {
  font-weight: 900;
  font-size: 24px;
  color: #db0000;
  text-shadow:
    1px 1px 1px rgba(255,255,255,.4),
    -1px -1px 1px rgba(0,0,0,.4);
  display: inline-block;
  transition: transform .3s ease-out;
  padding: 0 2px;
}

.button:hover span {
  color: #d30000;
}

.button span:hover {
  transform: translateY(-7px);
}

.button:active {
  box-shadow:
    inset 2px 2px 1px rgba(0,0,0,.3),
    inset -2px -2px 1px rgba(255,255,255,.5);
  transform: scale(.98);
}

/* Delay for wave effect */
.button span:nth-child(1){transition-delay:0ms;}
.button span:nth-child(2){transition-delay:50ms;}
.button span:nth-child(3){transition-delay:100ms;}
.button span:nth-child(4){transition-delay:150ms;}
.button span:nth-child(5){transition-delay:200ms;}
.button span:nth-child(6){transition-delay:250ms;}
.button span:nth-child(7){transition-delay:300ms;}
.button span:nth-child(8){transition-delay:350ms;}
.button span:nth-child(9){transition-delay:400ms;}
.button span:nth-child(10){transition-delay:450ms;}

</style>
</head>
<body>

<div class="container">

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>1</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>2</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>3</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>4</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>5</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>6</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>7</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>8</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>9</span>
</div>

<div class="button">
<span>B</span><span>u</span><span>t</span><span>t</span><span>o</span><span>n</span><span> </span><span>1</span><span>0</span>
</div>

</div>

</body>
</html>
