<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Buttons</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1e1e1e;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

button{
    width:100%;
    height:60px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#3498db;
    color:white;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#2980b9;
    transform:translateY(-3px);
}

button:active{
    transform:scale(.97);
}

/* 📱 Phones */
@media (max-width:600px){

    .container{
        grid-template-columns:1fr;
    }

    button{
        height:65px;
        font-size:20px;
    }

}
</style>
</head>

<body>

<div class="container">
    <button onclick="location.href='eggs/Digital Clock.html'">Digital Clock</button>
    <button onclick="location.href='eggs/Age Calculator.html'">Age Calculator</button>
    <button onclick="location.href='eggs/Bouncing ball.html'">Bouncing ball</button>
    <button onclick="location.href='eggs/Box nav.html'">Box nav</button>
    <button onclick="location.href='eggs/Calculator.html'">Calculator</button>
    <button onclick="location.href='eggs/Change BG Color with Dropdown.html'">Change BG Color with Dropdown</button>
    <button onclick="location.href='eggs/Chess.html'">Chess</button>
    <button onclick="location.href='eggs/Gradient Color Effect.html'">Gradient Color Effect</button>
    <button onclick="location.href='eggs/HTML Editor 1.0.html'">HTML Editor 1.0</button>
    <button onclick="location.href='eggs/To do list.html'">To do list</button>
    <button onclick="location.href='eggs/Turning pages with css.html'">Turning pages with css</button>
    <button onclick="location.href='eggs/Wow.html'">Wow</button>
    <button onclick="location.href='eggs/iPhone Calculator.html'">iPhone Calculator</button>
    <button onclick="location.href='eggs/t-rex runner.html'">t-rex runner</button>
    <button onclick="location.href='eggs/tic tac Toe by austin.html'">tic tac toe (blue)</button>
    <button onclick="location.href='eggs/tic tac Toe candy theme.html'">tic tac toe (pink)</button>
    <button onclick="location.href='eggs/tic tac toe yellow.html'">tic tac toe (yellow)</button>
    <button onclick="location.href='eggs/.html'">Button 9</button>
    <button onclick="location.href='eggs/.html'">Button 10</button>
</div>

</html>
